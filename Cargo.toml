[package]
name = "statrack"
version = "0.1.0"
edition = "2024"

[dependencies]
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
garde = { version = "0.23.0", features = ["derive", "url"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time", "env-filter"] }
